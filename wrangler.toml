name = "openclaw"
main = "src/index.js"
compatibility_date = "2024-12-01"
workers_dev = true

# Workers Observability - real-time logs via `wrangler tail`
[observability]
enabled = true
head_sampling_rate = 1

# Custom domain route
[[routes]]
pattern = "your-honeypot-domain.com/*"
zone_name = "your-domain.com"

[vars]
ENVIRONMENT = "production"

[[d1_databases]]
binding = "DB"
database_name = "openclaw-honeypot"
database_id = "YOUR_D1_DATABASE_ID"

# ============================================================
# CLOUDFLARE DASHBOARD SETTINGS (configure manually)
# Dashboard: https://dash.cloudflare.com > hxorz.com zone
#
# 1. Security > Overview > Security Level: "Essentially Off"
# 2. Security > WAF > Managed Rules: 全部禁用 (或 Skip WAF 规则)
# 3. Security > Bots > Bot Fight Mode: Off
# 4. Speed > Optimization > Rocket Loader: Off
# 5. Caching > Cache Rules: 匹配 claw.hxorz.com/*, Cache Status = Bypass
# 6. Network > WebSockets: On
# ============================================================
