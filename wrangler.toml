name = "openclaw-honeypot"
main = "src/index.js"
compatibility_date = "2026-08-15"
workers_dev = true

[observability]
enabled = true
head_sampling_rate = 1

[vars]
ENVIRONMENT = "production"

[[d1_databases]]
binding = "DB"
database_name = "openclaw-honeypot"
database_id = "YOUR_D1_DATABASE_ID"

# ============================================================
# Optional Cloudflare Dashboard hardening (honeypot hostnames only)
#
# 1. Security Level: Essentially Off
# 2. WAF Managed Rules: disable only for the honeypot hostnames
# 3. Bot Fight Mode: Off
# 4. Rocket Loader: Off
# 5. Cache: Bypass
# 6. WebSockets: On
# ============================================================
