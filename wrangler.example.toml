name = "workers-honeypot"
main = "src/index.js"
compatibility_date = "2026-08-15"
workers_dev = true

[observability]
enabled = true
head_sampling_rate = 1

[vars]
ENVIRONMENT = "production"

[[d1_databases]]
binding = "DB"
database_name = "workers-honeypot"
database_id = "YOUR_D1_DATABASE_ID"

