name: Deploy to Cloudflare Workers

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate deployment secrets
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_D1_DATABASE_ID"
          test -n "$ADMIN_PASSWORD"
      - name: Inject the user's D1 binding
        shell: bash
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const id = process.env.CLOUDFLARE_D1_DATABASE_ID; if (!/^[0-9a-f-]{36}$/i.test(id)) throw new Error('CLOUDFLARE_D1_DATABASE_ID must be a UUID'); const path='wrangler.toml'; const config=fs.readFileSync(path,'utf8'); fs.writeFileSync(path, config.replace('YOUR_D1_DATABASE_ID', id));"
      - run: npx wrangler d1 execute workers-honeypot --remote --file=schema.sql
      - name: Configure Admin password
        shell: bash
        run: printf '%s' "$ADMIN_PASSWORD" | npx wrangler secret put ADMIN_PASSWORD
      - run: npx wrangler deploy
